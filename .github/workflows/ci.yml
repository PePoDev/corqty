name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: corqty_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d corqty_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Create database roles
        env:
          PGHOST: localhost
          PGPORT: "55432"
          PGPASSWORD: postgres_dev
          POSTGRES_USER: postgres
          POSTGRES_DB: corqty_test
          CORQTY_OWNER_DB_PASSWORD: corqty_owner_dev
          CORQTY_API_DB_PASSWORD: corqty_api_dev
          CORQTY_WORKER_DB_PASSWORD: corqty_worker_dev
        run: bash docker/postgres/init/001-roles.sh
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm web:test
      - run: pnpm web:build
      - name: Start fresh Compose stack
        env:
          CORQTY_WORKER_CAPACITY: "1"
        run: docker compose --project-name corqty-ci up --build --wait --scale worker=3
      - name: Run Compose smoke test
        shell: pwsh
        run: ./scripts/smoke-foundation.ps1 -ProjectName corqty-ci -ExpectedWorkers 3
      - name: Remove Compose stack
        if: always()
        run: docker compose --project-name corqty-ci down --volumes
