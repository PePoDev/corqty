services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corqty}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev}
      CORQTY_OWNER_DB_PASSWORD: ${CORQTY_OWNER_DB_PASSWORD:-corqty_owner_dev}
      CORQTY_API_DB_PASSWORD: ${CORQTY_API_DB_PASSWORD:-corqty_api_dev}
      CORQTY_WORKER_DB_PASSWORD: ${CORQTY_WORKER_DB_PASSWORD:-corqty_worker_dev}
    ports:
      - "${CORQTY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U postgres -d ${POSTGRES_DB:-corqty}",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: docker/rust/Dockerfile
      target: migrate
    init: true
    environment:
      DATABASE_URL_OWNER: ${DATABASE_URL_OWNER:-postgres://corqty_owner:corqty_owner_dev@postgres:5432/corqty}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/rust/Dockerfile
      target: api
    init: true
    environment:
      DATABASE_URL_API: ${DATABASE_URL_API:-postgres://corqty_api:corqty_api_dev@postgres:5432/corqty}
      CORQTY_BIND_ADDRESS: 0.0.0.0:8080
      CORQTY_PUBLIC_WEB_URL: ${CORQTY_PUBLIC_WEB_URL:-http://localhost:3000}
      CORQTY_SECURE_COOKIES: ${CORQTY_SECURE_COOKIES:-false}
      RUST_LOG: ${RUST_LOG:-corqty_api=info,tower_http=info}
    ports:
      - "${CORQTY_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v1/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: docker/rust/Dockerfile
      target: worker
    init: true
    # The shell executor writes only to its scratch directories in /tmp.
    read_only: true
    tmpfs:
      - /tmp
    # A worker drains its attempts for 25 s and then gives executors 5 s to stop.
    stop_grace_period: 30s
    environment:
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:-postgres://corqty_worker:corqty_worker_dev@postgres:5432/corqty}
      CORQTY_WORKER_CAPACITY: ${CORQTY_WORKER_CAPACITY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/corqty-worker", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      CORQTY_API_ORIGIN: ${CORQTY_API_ORIGIN:-http://api:8080}
    ports:
      - "${CORQTY_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  postgres-data:
